# Research positions. Rendered as "Research Experience" in the CV and as
# work experience in the resume / JSON export.
research:
  - position: "Graduate Research Assistant"
    organization: "University of Alabama, CMS Experiment at CERN"
    location: "Tuscaloosa, AL"
    start: "2024"
    end: "present"
    supervisor: "Dr. Emanuele Usai"
    highlights:
      - text: "Develop the analysis framework for the search for four-top-quark production in the single-lepton final state with CMS Run 3 data."
        resume: true
      - text: "Set up the Multi-Module Testing System (MMTS) used to test HGCAL hexaboards for the CMS Phase-2 upgrade."
        resume: true
      - text: "Contribute to data-quality monitoring (DQM) software for HGCAL."
        resume: true
      - text: "Co-author of a study on continual learning with masked autoencoders for data-quality monitoring (arXiv:2603.02369)."
    resume: true

  - position: "Graduate Research Assistant"
    organization: "University of Puerto Rico, Mayagüez, CMS Experiment at CERN"
    location: "Mayagüez, PR"
    start: "2020"
    end: "2024"
    highlights:
      - text: "Measured trigger efficiencies in the signal and signal-free regions of the CMS search for emerging jets with full Run 2 data (JHEP 07 (2024) 142)."
        resume: true
      - text: "Developed machine-learning tools that help DQM shifters certify CMS Tracker data, and studied their use for the Tracker upgrade."
        resume: true
    links:
      - label: "Master's thesis"
        url: "https://github.com/GuillermoFidalgo/master-thesis/releases/download/v2.2/main.pdf"
    resume: true

  - position: "Summer Research Intern (REU), Pathways to CU Physics"
    organization: "University of Colorado Boulder"
    location: "Boulder, CO"
    start: "2021-06"  # final report is dated Aug 6, 2021
    end: "2021-08"
    period: "Summer 2021"
    supervisor: "Dr. Keith Ulmer"
    highlights:
      - text: "Developed a new High Level Trigger path to select events with signatures of dark-matter decays to emerging jets."
        resume: true
    links:
      - label: "Final report"
        url: "/assets/pdfs/CU_Pathways_Final_Report.pdf"
      - label: "Ulmer lab"
        url: "https://www.colorado.edu/program/pathways-to-cu-physics/ulmer-lab"
      - label: "Student highlight"
        url: "https://www.colorado.edu/physics-jila-reu/research/new-trigger-studies-emerging-jets-cms-experiment"
    resume: true

  - position: "Visiting Undergraduate Researcher, University of Michigan–CERN Research Semester"
    organization: "CERN"
    location: "Geneva, Switzerland"
    start: "2018-01"  # CERN talks on Indico: Mar 15, Apr 12, May 14, 2018
    end: "2018-05"
    period: "Spring 2018"
    highlights:
      - text: "Applied machine learning to data-quality monitoring of the CMS Hadron Calorimeter (HCAL); this became the basis of my undergraduate thesis."
        resume: true
      - text: "Presented the work three times at CERN (March 15, April 12 and May 14, 2018)."
    links:
