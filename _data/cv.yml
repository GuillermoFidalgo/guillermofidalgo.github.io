# =============================================================================
# CV / Resume — single source of truth
# =============================================================================
# Edit ONLY this file, then run:   python cv/build_cv.py
# That regenerates:
#   cv/CV.md        full academic CV (everything below)
#   cv/resume.md    short resume (only entries marked `resume: true`)
#   cv/resume.json  JSON Resume export (https://jsonresume.org/schema) for
#                   other tools, themes and job portals
#
# Because it lives in _data/, Jekyll can also read it as `site.data.cv`.
#
# Conventions
#   - Dates are quoted strings: "2026", "2026-03" or "2026-03-19".
#     If a date is unknown, leave it out; the entry is listed without one.
#   - Positions (education, research, leadership) use start / end, with
#     end: "present" for ongoing ones.
#   - Events (talks, workshops, outreach, service) use date, plus end for
#     multi-day events (date: "2022-07-19", end: "2022-07-23").
#   - Optional `period: "Summer 2021"` replaces the displayed date text;
#     start / end are still used for sorting and the JSON export.
#   - Add `resume: true` to any entry (or highlight) you want in the resume.
#   - Keep text plain (no Markdown); put links in `url` / `links`.
#     Links to files on this site can be site-relative ("/assets/pdfs/x.pdf").
#   - Lines marked "TODO" are details still missing.
# =============================================================================

