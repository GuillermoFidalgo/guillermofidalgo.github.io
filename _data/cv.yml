  name: "Guillermo A. Fidalgo Rodríguez"
  label: "PhD Student in Experimental Particle Physics, CMS Experiment"
  email: "gafidalgo@crimson.ua.edu"
  url: "https://guillermofidalgo.github.io/"
  location:
    city: "Tuscaloosa"
    region: "AL"
    country: "USA"
  profiles:
    - network: "GitHub"
      username: "GuillermoFidalgo"
      url: "https://github.com/GuillermoFidalgo"
    - network: "LinkedIn"
      username: "guillermo-fidalgo"
      url: "https://www.linkedin.com/in/guillermo-fidalgo"
    - network: "ORCID"
      username: "0000-0001-8605-9772"
      url: "https://orcid.org/0000-0001-8605-9772"
    - network: "INSPIRE-HEP"
      username: "Guillermo.Fidalgo.1"
      url: "https://inspirehep.net/authors?q=a%20Guillermo.Fidalgo.1"
  summary:
    # Long form, used in the CV.
    cv: >-
      PhD student in experimental high-energy physics at the University of
      Alabama and member of the CMS Collaboration at CERN's Large Hadron
      Collider, advised by Dr. Emanuele Usai. My research covers the search
      for four-top-quark production in Run 3, testing and data-quality
      monitoring for the CMS High Granularity Calorimeter (HGCAL) upgrade, and
      machine learning for detector data-quality monitoring. Alongside
      research, I train physicists in research software: I am on the training
      teams of HSF and IRIS-HEP, a certified Carpentries instructor, a
      facilitator at the CMS Data Analysis School, and I have taught, mentored
      or organized more than 25 workshops and courses for audiences from high
      school students and STEM teachers in Puerto Rico to HEP postdocs.
    # Short form, used in the resume and JSON export.
    resume: >-
      Experimental particle physicist (PhD student, CMS/CERN) who builds Python
      analysis frameworks, machine-learning tools for detector monitoring, and
      hardware test systems. Experienced teacher of research software (HSF,
      IRIS-HEP, The Carpentries) and bilingual in English and Spanish.

